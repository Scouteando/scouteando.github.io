<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scouteando · Estadísticas de jugadores de fútbol</title>
  <meta name="description" content="Estadísticas de jugadores de las ligas de Argentina, Brasil, Colombia y Chile 2026: rankings por puesto, líderes, posiciones y comparador.">
  <!-- Vista previa al compartir el link (WhatsApp, X, etc.). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Scouteando · Estadísticas de jugadores de fútbol">
  <meta property="og:description" content="Jugadores, rankings por puesto, líderes y posiciones de las ligas de Argentina, Brasil, Colombia y Chile 2026.">
  <meta property="og:image" content="https://scouteando.github.io/compartir.png">
  <meta property="og:url" content="https://scouteando.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Ícono de la pestaña: una pelota dibujada con SVG -->
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <!-- Para instalarla como app en el celular -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scouteando">

  <!-- Tipografía de Google Fonts: Archivo (ancha en títulos, normal en texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,100,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilos.css?v=47">
</head>
<body>

  <!-- Menú: dos secciones -->
  <nav class="menu" id="menuLiga" hidden>
    <button class="menu__opcion activo" data-vista="equipos">Equipos</button>
    <button class="menu__opcion" data-vista="lideres">Líderes</button>
    <button class="menu__opcion" data-vista="sub21">Sub-21</button>
    <button class="menu__opcion menu__opcion--extra" data-vista="ideal">Equipo de la fecha</button>
    <button class="menu__opcion" data-vista="posiciones">Posiciones</button>
    <button class="menu__opcion menu__opcion--extra" data-vista="comparar">Comparar</button>
    <button class="menu__opcion menu__opcion--extra" data-vista="seguidos">⭐ Mis jugadores</button>
    <button class="menu__opcion menu__mas" id="menuMas" aria-expanded="false">Más ▾</button>
  </nav>

  <header class="cabecera">
    <div class="marca"><img class="marca__logo" src="logo.svg" alt=""><p class="cabecera__liga" id="volver">Scouteando</p></div>
    <h1 id="titulo">Equipos</h1>
    <p class="cabecera__sub" id="resumen"></p>
  </header>

  <!-- Buscador de jugadores: en la portada busca en todas las ligas; dentro de una liga, solo en esa -->
  <section class="busqueda-global" id="busquedaGlobal">
    <input id="buscadorGlobal" class="campo campo--grande" type="search" placeholder="Buscá un jugador de cualquier liga…">
    <ul class="resultados" id="resultadosGlobal"></ul>
  </section>

  <!-- VISTA LIGAS: pantalla de inicio -->
  <main class="ligas" id="vistaLigas"></main>

  <!-- VISTA 1: grilla con los 30 equipos -->
  <main class="equipos" id="vistaEquipos"></main>

  <!-- Filtros de Líderes: edad y puesto -->
  <section class="controles" id="filtrosLideres" hidden>
    <div class="filtros">
      <button class="filtro activo" data-puesto="TODOS">Todos los puestos</button>
      <button class="filtro" data-puesto="ARQ">Arqueros</button>
      <button class="filtro" data-puesto="DEF">Defensores</button>
      <button class="filtro" data-puesto="MED">Mediocampistas</button>
      <button class="filtro" data-puesto="DEL">Delanteros</button>
    </div>
    <div class="controles__fila">
      <label class="orden">Edad
        <select id="filtroEdad" class="campo">
          <option value="">Todas</option>
          <option value="0-21">Sub-21</option>
          <option value="0-23">Sub-23</option>
          <option value="24-29">24 a 29 años</option>
          <option value="30-99">30 años o más</option>
        </select>
      </label>
      <label class="orden">Nacionalidad
        <!-- JavaScript la llena con los países de la liga -->
        <select id="filtroPais" class="campo"></select>
      </label>
      <label class="orden">Minutos jugados
        <select id="filtroMinutos" class="campo">
          <option value="0">Cualquiera</option>
          <option value="450">450' o más (5 partidos)</option>
          <option value="900">900' o más (10 partidos)</option>
          <option value="1350">1350' o más (15 partidos)</option>
        </select>
      </label>
    </div>
  </section>

  <!-- VISTA LÍDERES: tablas Top 10 -->
  <main class="lideres" id="vistaLideres" hidden></main>

  <!-- VISTA POSICIONES: tablas del torneo -->
  <main class="vista-posiciones" id="vistaPosiciones" hidden></main>

  <!-- VISTA MIS JUGADORES: lista de seguimiento -->
  <main class="grilla" id="vistaSeguidos" hidden></main>

  <!-- VISTA COMPARAR: dos jugadores de cualquier liga -->
  <main class="vista-comparar" id="vistaComparar" hidden></main>

  <!-- VISTA SUB-21: los jóvenes de todas las ligas -->
  <main class="vista-sub21" id="vistaSub21" hidden></main>

  <!-- VISTA EQUIPO DE LA FECHA: 4-3-3 dibujado en una cancha -->
  <main class="vista-ideal" id="vistaIdeal" hidden></main>

  <!-- VISTA 2: jugadores (de un equipo o de toda la liga) -->
  <section id="vistaJugadores" hidden>
    <!-- Resumen del equipo: goleador, asistidor, etc. -->
    <div class="resumen-equipo" id="resumenEquipo" hidden></div>

    <div class="controles">
      <div class="controles__fila">
        <input id="buscador" class="campo campo--buscar" type="search" placeholder="Filtrar este plantel…">
        <label class="orden">
          Ordenar por
          <!-- JavaScript llena esta lista con las estadísticas disponibles -->
          <select id="orden" class="campo"></select>
        </label>
      </div>
      <div class="filtros">
        <button class="filtro activo" data-puesto="TODOS">Todos</button>
        <button class="filtro" data-puesto="ARQ">Arqueros</button>
        <button class="filtro" data-puesto="DEF">Defensores</button>
        <button class="filtro" data-puesto="MED">Mediocampistas</button>
        <button class="filtro" data-puesto="DEL">Delanteros</button>
      </div>
    </div>

    <div class="grilla" id="grilla"></div>

    <div class="mas">
      <button id="verMas" class="filtro">Ver más jugadores</button>
    </div>
  </section>

  <!-- Ficha individual (se abre al tocar una carta) -->
  <div class="ficha" id="ficha" hidden></div>

  <footer class="pie">
    Estadísticas: FBref · Fotos y escudos: API-Football · Banderas: flagcdn.com ·
    <button class="pie__link" id="abrirAcerca">Acerca de</button> ·
    <button class="pie__link" id="instalarApp" hidden>📲 Instalar app</button>
    <span class="pie__contacto">¿Sos de un club, agencia o medio? Escribí a
      <a class="pie__link" href="mailto:scouteando.contacto@gmail.com">scouteando.contacto@gmail.com</a></span>
  </footer>

  <!-- La lista de ligas; los datos de cada liga se cargan al elegirla -->
  <!-- Aviso mientras se cargan los datos de una liga -->
  <div class="cargando" id="cargando" role="status" hidden></div>

  <script src="datos/generados/portada.js?v=47"></script>
  <script src="ligas.js?v=47"></script>
  <script src="app.js?v=47"></script>
</body>
</html>
